 </div>`}

<div className="field"><label>Category</label><select value=${form.category} onChange=${e=>update('category',e.target.value)}><option>Meals</option><option>Hotel</option><option>Mileage</option><option>Airfare</option><option>Office Supplies</option><option>Restaurant Supplies</option><option>Technology</option><option>Training</option><option>Other</option></select></div>
<div className="field"><label>Subcategory</label><select value=${form.sub} onChange=${e=>update('sub',e.target.value)}><option>Lunch</option><option>Dinner</option><option>Lodging</option><option>Company Travel</option><option>Supplies</option><option>Accessories</option></select></div>
<div className="field"><label>Merchant</label><input placeholder="e.g. Hy-Vee" value=${form.merchant} onChange=${e=>update('merchant',e.target.value)}/></div><div className="field"><label>Date</label><input type="date" value=${form.date} onChange=${e=>update('date',e.target.value)}/></div>
<div className="field full"><label>Business purpose</label><input placeholder="Why was this purchase needed?" value=${form.purpose} onChange=${e=>update('purpose',e.target.value)}/></div><div className="field full"><label>Description <span className="muted">(optional)</span></label><textarea rows="3" placeholder="Add any helpful context" value=${form.desc} onChange=${e=>update('desc',e.target.value)}></textarea></div>
<div className="field full"><label>Receipt</label><div className=${`dropzone ${drag?'drag':''}`} onDragOver=${e=>{e.preventDefault();setDrag(true)}} onDragLeave=${()=>setDrag(false)} onDrop=${e=>{e.preventDefault();setDrag(false);update('receipt',true);toast('Receipt attached.','good')}}><strong>${form.receipt?'Receipt attached ✓':'Drop receipt here'}</strong><div className="muted" style=${{fontSize:'12px',marginTop:'5px'}}>or click to choose a file</div><input type="file" accept="image/*,.pdf" style=${{marginTop:'10px'}} onChange=${e=>update('receipt',!!e.target.files?.length)}/></div>${form.receipt&&html`<div className="receiptPreview"><div className="receiptMock"></div></div>`}</div>
</div></div><div className="drawerFoot"><button className="btn secondary" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>Save Expense</button></div></aside></>`}
function Home({expenses,onAdd,onNav}){const total=expenses.reduce((s,e)=>s+e.amount,0);const missing=expenses.filter(e=>!e.receipt).length;return html`<><div className="pageHead"><div><div className="eyebrow">Employee workspace</div><h1>Good afternoon, Saul</h1><p>Your reimbursement work is in good shape. Two receipts still need attention before this report is ready to submit.</p></div><button className="btn primary" onClick=${onAdd}>＋ Add Expense</button></div><div className="grid dashboardGrid"><section className="card hero"><div className="heroHeader"><div><div className="eyebrow">Current Report</div><h2>September 1–15, 2026</h2></div><${Status} value="Draft"/></div><div className="amount">${money(total)}</div><div className="metaRow"><span>${expenses.length} expenses</span><span>•</span><span>${missing} missing receipts</span><span>•</span><span>5 days remaining</span></div><div className="stats"><div className="stat"><strong>${expenses.length}</strong><small>Expenses</small></div><div className="stat"><strong>${missing}</strong><small>Need receipts</small></div><div className="stat"><strong>${money(total)}</strong><small>Report total</small></div></div><div className="heroActions"><button className="btn primary" onClick=${onAdd}>＋ Add Expense</button><button className="btn secondary" onClick=${()=>onNav('reports')}>Open Report</button></div></section><section className="card"><div className="sectionTitle"><h2>Spending breakdown</h2><span className="pill">This report</span></div><div className="breakdown"><div className="donut"></div><div className="legend"><div className="legendRow"><span className="dot" style=${{background:'var(--red)'}}></span><span>Airfare</span><strong>$224.91</strong></div><div className="legendRow"><span className="dot" style=${{background:'var(--gold)'}}></span><span>Hotel</span><strong>$168.44</strong></div><div className="legendRow"><span className="dot" style=${{background:'var(--green)'}}></span><span>Technology</span><strong>$33.40</strong></div><div className="legendRow"><span className="dot" style=${{background:'var(--blue)'}}></span><span>Other</span><strong>$55.62</strong></div></div></div></section></div><section className="card" style=${{marginTop:'18px'}}><div className="sectionTitle"><h2>Recent expenses</h2><button className="btn ghost" onClick=${()=>onNav('expenses')}>View all →</button></div><div className="list">${expenses.slice(0,4).map(e=>html`<${ExpenseRow} e=${e}/>` )}</div></section></>`}
function Reports({expenses,reports,toast}){const [expanded,setExpanded]=useState(null);const total=expenses.reduce((s,e)=>s+e.amount,0);const missing=expenses.filter(e=>!e.receipt).length;const submit=()=>missing?toast(`${missing} receipt${missing===1?' is':'s are'} still missing.`,'bad'):toast('Report submitted to your approver.','good');return html`<><div className="pageHead"><div><div className="eyebrow">My Reports</div><h1>Current report</h1><p>Review each expense, resolve missing documentation, and submit when everything is ready.</p></div><button className="btn primary" onClick=${submit}>Submit Report</button></div><section className="card"><div className="heroHeader"><div><h2 style=${{margin:'0 0 5px'}}>September 1–15, 2026</h2><div className="metaRow"><span>${expenses.length} expenses</span><span>•</span><span>${money(total)}</span><span>•</span><span>${missing} missing receipts</span></div></div><${Status} value="Draft"/></div><${Timeline} stage="Employee"/><div className="list">${expenses.map(e=>html`<${ExpenseRow} key=${e.id} e=${e} expanded=${expanded===e.id} onToggle=${id=>setExpanded(expanded===id?null:id)}/>` )}</div><div className="heroActions" style=${{justifyContent:'flex-end'}}><button className="btn secondary">Download PDF</button><button className="btn primary" onClick=${submit}>Submit Report</button></div></section><section className="card" style=${{marginTop:'18px'}}><div className="sectionTitle"><h2>Previous reports</h2></div><table className="reportsTable"><thead><tr><th>Report</th><th>Total</th><th>Expenses</th><th>Status</th><th>Submitted</th></tr></thead><tbody>${reports.slice(1).map(r=>html`<tr><td className="reportName">${r.name}</td><td>${money(r.total)}</td><td>${r.count}</td><td><${Status} value=${r.status}/></td><td>${r.submitted}</td></tr>`)}</tbody></table></section></>`}
function Expenses({expenses,onAdd}){const [q,setQ]=useState('');const [cat,setCat]=useState('All');const [expanded,setExpanded]=useState(null);const visible=expenses.filter(e=>(cat==='All'||e.category===cat)&&(`${e.merchant} ${e.purpose} ${e.desc}`.toLowerCase().includes(q.toLowerCase())));return html`<><div className="pageHead"><div><div className="eyebrow">Expense history</div><h1>Expenses</h1><p>Search and review draft and previously submitted expenses.</p></div><button className="btn primary" onClick=${onAdd}>＋ Add Expense</button></div><section className="card"><div className="toolbar"><div className="search"><input id="expenseSearch" placeholder="Search merchant, purpose, description…" value=${q} onChange=${e=>setQ(e.target.value)}/></div><div className="filters"><select value=${cat} onChange=${e=>setCat(e.target.value)}><option>All</option>${[...new Set(expenses.map(e=>e.category))].map(c=>html`<option>${c}</option>`)}</select><select><option>All states</option><option>Draft</option><option>Submitted</option></select></div></div><div className="list" style=${{marginTop:'16px'}}>${visible.length?visible.map(e=>html`<${ExpenseRow} key=${e.id} e=${e} expanded=${expanded===e.id} onToggle=${id=>setExpanded(expanded===id?null:id)}/>`):html`<div className="empty"><strong>No expenses found.</strong><div>Try changing your filters.</div></div>`}</div></section></>`}
function Approvals({toast}){const [items,setItems]=useState(approvalSeed);const [selected,setSelected]=useState('a1');const current=items.find(x=>x.id===selected)||items[0];const act=(action)=>{if(!current)return;toast(`${current.employee}'s report ${action}.`,'good');if(action==='approved')setItems(xs=>xs.filter(x=>x.id!==current.id))};return html`<><div className="pageHead"><div><div className="eyebrow">Approver workspace</div><h1>Approvals</h1><p>Review reports quickly without bouncing between pages. Reports with missing documentation are surfaced first.</p></div><span className="pill">${items.length} waiting</span></div><div className="approvalLayout"><section className="card"><div className="sectionTitle"><h2>Needs your attention</h2><span className="pill">Oldest first</span></div><div className="queue">${items.map(x=>html`<button className=${`queueItem ${x.id===selected?'active':''}`} onClick=${()=>setSelected(x.id)}><div className="queueTop"><strong>${x.employee}</strong><strong>${money(x.total)}</strong></div><div className="expenseMeta">${x.report} · ${x.count} expenses · ${x.age} ago</div><div style=${{marginTop:'8px',display:'flex',gap:'6px',alignItems:'center'}}><${Status} value=${x.status}/>${x.receipts!==`${x.count}/${x.count}`&&html`<span className="receiptFlag">${x.receipts} receipts</span>`}</div></button>`)}</div></section><section className="card reviewPane">${current?html`<div className="heroHeader"><div><div className="eyebrow">Report review</div><h2 style=${{margin:'5px 0'}}>${current.employee}</h2><div className="metaRow"><span>${current.report}</span><span>•</span><span>${current.count} expenses</span><span>•</span><span>${current.receipts} receipts</span></div></div><div className="amount" style=${{fontSize:'38px',margin:'0'}}>${money(current.total)}</div></div><${Timeline} stage="Approver"/><div className="receiptLarge"><div className="receiptPaper"><strong>${current.merchant}</strong><br/><br/>Business Expense<br/>09/08/2026<br/><br/>Subtotal........${money(current.amount-3.14)}<br/>Tax..............$3.14<br/><br/><strong>Total...........${money(current.amount)}</strong><br/><br/>Thank you</div></div><div className="expense" style=${{marginTop:'14px'}}><div className="expenseTop"><div><strong>${current.merchant}</strong><div className="expenseMeta">Meals & Snacks · Employee travel meal</div><div className="expensePurpose">Business meal while visiting a restaurant test.</div></div><strong>${money(current.amount)}</strong></div></div><div className="approvalActions"><button className="btn good" onClick=${()=>act('approved')}>✓ Approve</button><button className="btn secondary" onClick=${()=>act('returned for correction')}>Return for Correction</button><button className="btn secondary" onClick=${()=>act('sent for additional approval')}>Request Additional Approval</button><button className="btn danger" onClick=${()=>act('denied')}>Deny</button></div>`:html`<div className="empty"><strong>You're caught up.</strong><div>No reports are waiting for approval.</div></div>`}</section></div></>`}
function Accounting({toast}){const rows=[{employee:'Saul Garcia',report:'August 1–15',total:641.84,count:11,status:'Accounting Review'},{employee:'Kara DeBoer',report:'August 16–31',total:288.17,count:5,status:'Accounting Review'},{employee:'Megan Vos',report:'August 16–31',total:512.50,count:8,status:'Accounting Review'}];return html`<><div className="pageHead"><div><div className="eyebrow">Accounting workspace</div><h1>Ready for reimbursement</h1><p>Reports shown here have completed approval and are ready for Accounting review.</p></div><span className="pill">3 ready</span></div><section className="card"><table className="reportsTable"><thead><tr><th>Employee</th><th>Report</th><th>Total</th><th>Expenses</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>html`<tr><td className="reportName">${r.employee}</td><td>${r.report}</td><td>${money(r.total)}</td><td>${r.count}</td><td><${Status} value=${r.status}/></td><td><button className="btn good" onClick=${()=>toast(`${r.employee}'s reimbursement marked complete.`,'good')}>Mark Complete</button></td></tr>`)}</tbody></table></section></>`}
function Settings(){const [notify,setNotify]=useState(true);const [compact,setCompact]=useState(false);return html`<><div className="pageHead"><div><div className="eyebrow">Preferences</div><h1>Settings</h1><p>Personal defaults and notification preferences for the expense experience.</p></div></div><div className="grid settingsGrid"><section className="card"><h2>Expense defaults</h2><div className="field" style=${{marginTop:'14px'}}><label>Default department</label><select><option>Profitability & Operations</option><option>Operations</option><option>IT</option><option>Accounting</option></select></div><div className="field" style=${{marginTop:'14px'}}><label>Mileage rate</label><input value="$0.40 / mile" readOnly/></div></section><section className="card"><h2>Experience</h2><div className="settingRow"><div><strong>Report reminders</strong><div className="muted">Notify me before a report period closes.</div></div><button className=${`toggle ${notify?'on':''}`} onClick=${()=>setNotify(!notify)}><span></span></button></div><div className="settingRow"><div><strong>Compact expense rows</strong><div className="muted">Show more expenses at once on desktop.</div></div><button className=${`toggle ${compact?'on':''}`} onClick=${()=>setCompact(!compact)}><span></span></button></div></section></div></>`}
function App(){const [view,setView]=useState('home');const [role,setRole]=useState('employee');const [expenses,setExpenses]=useState(seedExpenses);const [drawer,setDrawer]=useState(false);const [toasts,setToasts]=useState([]);const toast=(text,kind='')=>{const id=Date.now()+Math.random();setToasts(t=>[...t,{id,text,kind}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2900)};useEffect(()=>{const onKey=e=>{if(e.key==='Escape')setDrawer(false);if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();setView('expenses');setTimeout(()=>document.getElementById('expenseSearch')?.focus(),100)}};window.addEventListener('keydown',onKey);return()=>window.removeEventListener('keydown',onKey)},[]);useEffect(()=>{if(role==='approver')setView('approvals');if(role==='accounting')setView('accounting');if(role==='employee'&&['approvals','accounting'].includes(view))setView('home')},[role]);const nav=role==='employee'?[['home','Home'],['reports','My Reports'],['expenses','Expenses'],['settings','Settings']]:role==='approver'?[['approvals','Approvals'],['reports','My Reports'],['expenses','Expenses']]:[['accounting','Accounting'],['reports','Reports']];const title=role==='employee'?'Employee Preview':role==='approver'?'Approver Preview':'Accounting Preview';const go=v=>setView(v);return html`<div className="app"><aside className="sidebar"><div className="brand"><div className="brandmark">R</div><div className="brandText"><strong>Ranch Expense Tracker</strong><small>Premium prototype</small></div></div><nav className="nav">${nav.map(([id,label])=>html`<button className=${view===id?'active':''} onClick=${()=>go(id)}><span className="icon">${Icons[id]||'•'}</span><span>${label}</span></button>`)}</nav><div className="sidebarFoot"><div className="userCard"><div className="avatar">SG</div><div><strong>Saul Garcia</strong><small>${title}</small></div></div><div className="roleSwitch"><button className=${role==='employee'?'active':''} onClick=${()=>setRole('employee')}>Employee</button><button className=${role==='approver'?'active':''} onClick=${()=>setRole('approver')}>Approver</button><button className=${role==='accounting'?'active':''} onClick=${()=>setRole('accounting')}>Accounting</button></div></div></aside><main className="main"><header className="topbar"><div className="topTitle"><strong>Ranch Expense Tracker</strong><span className="pill">UI prototype · mock data</span></div><div className="topActions"><button className="btn secondary" onClick=${()=>toast('Command palette would open here in production.')}>⌘ Quick actions</button>${role==='employee'&&html`<button className="btn primary" onClick=${()=>setDrawer(true)}>＋ Add Expense</button>`}</div></header><div className="content">${view==='home'&&html`<${Home} expenses=${expenses} onAdd=${()=>setDrawer(true)} onNav=${go}/>`}${view==='reports'&&html`<${Reports} expenses=${expenses} reports=${seedReports} toast=${toast}/>`}${view==='expenses'&&html`<${Expenses} expenses=${expenses} onAdd=${()=>setDrawer(true)}/>`}${view==='approvals'&&html`<${Approvals} toast=${toast}/>`}${view==='accounting'&&html`<${Accounting} toast=${toast}/>`}${view==='settings'&&html`<${Settings}/>`}</div></main>${drawer&&html`<${AddExpense} onClose=${()=>setDrawer(false)} onSave=${e=>setExpenses(x=>[e,...x])} toast=${toast}/>`}<${Toasts} items=${toasts}/><nav className="mobileNav">${[['home','Home'],['reports','Reports'],['expenses','Expenses'],['approvals','Approvals'],['settings','Settings']].map(([id,label])=>html`<button className=${view===id?'active':''} onClick=${()=>{if(id==='approvals')setRole('approver');else{if(role!=='employee')setRole('employee');go(id)}}}><span className="mi">${Icons[id]||'•'}</span>${label}</button>`)}</nav></div>`}
createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
