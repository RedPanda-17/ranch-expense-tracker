<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranch Expense Tracker - Supabase Sync Test</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5efe4}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="app" src="./expense-entry-efficiency-test-2.html?supabase=sync1" title="Ranch Expense Tracker Supabase Sync Test"></iframe>
<script>
const frame=document.getElementById("app");
let injected=false;
function tryInject(){
  try{
    const doc=frame.contentDocument;
    if(!doc?.getElementById("settings")||injected)return setTimeout(tryInject,150);
    injected=true;
    const script=doc.createElement("script");
    script.src="./supabase-sync-bridge.js?v=1";
    script.onerror=()=>{injected=false;setTimeout(tryInject,500)};
    doc.body.appendChild(script);
    const marker=doc.getElementById("efficiencyTestMarker");
    if(marker)marker.textContent="Supabase Sync Test 1 · Efficiency Test 2 base · Production unchanged";
  }catch(e){setTimeout(tryInject,250)}
}
frame.addEventListener("load",()=>{injected=false;setTimeout(tryInject,100)});
setTimeout(tryInject,300);
</script>
</body>
</html>
