function toast(text,kind='good'){const id=Date.now()+Math.random();state.toasts.push({id,text,kind});renderLayers();setTimeout(()=>{state.toasts=state.toasts.filter(t=>t.id!==id);renderLayers()},2600)}
function navForRole(){return state.role==='employee'?[['home','Home'],['reports','My Reports'],['expenses','Expenses'],['settings','Settings']]:state.role==='approver'?[['approvals','Approvals'],['reports','My Reports'],['expenses','Expenses']]:[['accounting','Accounting'],['reports','Reports']]}
function setRole(role){state.loading=true;render();setTimeout(()=>{state.role=role;state.view=role==='employee'?'home':role==='approver'?'approvals':'accounting';state.loading=false;render()},280)}

function sidebar(){return `<aside class="sidebar"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M5 8h14v9H5z"/><path d="M8 8V5h8v3M8 12h8"/></svg></div><div><strong>Ranch Expense Tracker</strong><small>Premium prototype</small></div></div><nav class="nav">${navForRole().map(([id,label])=>`<button class="${state.view===id?'active':''}" data-nav="${id}">${icons[id]||''}<span>${label}</span></button>`).join('')}</nav><div class="sidebarFoot"><div class="person"><div class="avatar">SG</div><div><strong>Saul Garcia</strong><small>${state.role==='employee'?'Employee preview':state.role==='approver'?'Approver preview':'Accounting preview'}</small></div></div><div class="roleSwitch">${['employee','approver','accounting'].map(r=>`<button class="${state.role===r?'active':''}" data-role="${r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div></div></aside>`}
function topbar(){return `<header class="topbar"><div class="topTitle"><strong>Ranch Expense Tracker</strong><span class="pill">UI prototype · mock data</span></div><div class="actions"><button class="btn secondary topActionsQuick" data-command>⌘ Quick actions</button>${state.role==='employee'?'<button class="btn primary" data-add>＋ Add Expense</button>':''}</div></header>`}
function pageHead(kicker,title,desc,action=''){return `<div class="pageHead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function expenseRow(e,interactive=true){return `<article class="expense ${interactive?'clickable':''}" data-expense="${e.id}"><div class="expenseTop"><div><div class="expenseTitle"><strong>${esc(e.merchant)}</strong><span class="pill">${esc(e.category)}</span>${!e.receipt&&e.category!=='Mileage'?'<span class="receiptFlag">Missing receipt</span>':''}</div><div class="expenseMeta">${fmt(e.date)} · ${esc(e.sub)}</div><div class="expensePurpose">${esc(e.purpose)}</div></div><div class="expenseAmt">${money(e.amount)}</div></div>${state.expanded===e.id?`<div class="expand"><div><strong>Description</strong><span class="muted">${esc(e.desc||'No description')}</span></div><div><strong>Documentation</strong><span class="muted">${e.receipt?'Receipt attached':'Missing'}</span></div><div><strong>Report state</strong><span class="muted">${e.reported?'Submitted':'Draft expense'}</span></div></div>`:''}</article>`}
function timeline(stage){const steps=['Employee','Approver','Accounting','Complete'],idx=Math.max(0,steps.indexOf(stage));return `<div class="timeline">${steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'active':''}"><strong>${s}</strong>${i<idx?'Completed':i===idx?'Current':'Pending'}</div>`).join('')}</div>`}
function home(){const exp=state.expenses.filter(e=>!e.reported),cats={};exp.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5),colors=['var(--red)','var(--gold)','var(--green)','var(--blue)','#b6aa9f'];return `${pageHead('Employee workspace','Good afternoon, Saul','Everything you need to finish this report without hunting through menus.','<button class="btn primary" data-add>＋ Add Expense</button>')}<div class="grid dashboardGrid"><section class="card hero hover"><div class="heroHeader"><div><div class="eyebrow">Current report</div><h2>${state.currentReport.title}</h2></div><span class="status ${statusClass(state.currentReport.status)}">${state.currentReport.status}</span></div><div class="amount">${money(currentTotal())}</div><div class="meta"><span>${exp.length} expenses</span><span>•</span><span>${missingCount()} missing receipts</span></div><div class="stats"><div class="stat"><strong>${exp.length}</strong><small>Expenses</small></div><div class="stat"><strong>${missingCount()}</strong><small>Missing receipts</small></div><div class="stat"><strong>${money(exp.length?currentTotal()/exp.length:0)}</strong><small>Avg. expense</small></div></div><div class="heroActions"><button class="btn primary" data-add>＋ Add Expense</button><button class="btn secondary" data-nav="reports">Open report</button></div></section><section class="card hover"><div class="sectionTitle"><h2>Spending breakdown</h2><span class="pill">Current report</span></div><div class="breakdown"><div class="donut"></div><div class="legend">${top.map(([c,v],i)=>`<div class="legendRow"><span class="dot" style="background:${colors[i]}"></span><span>${esc(c)}</span><strong>${money(v)}</strong></div>`).join('')}</div></div></section></div><section class="card" style="margin-top:18px"><div class="sectionTitle"><div><div class="eyebrow">Latest activity</div><h2>Recent expenses</h2></div><button class="btn ghost small" data-nav="expenses" function reportTable(rows){return `<table class="reportsTable"><thead><tr><th>Report</th><th>Total</th><th>Expenses</th><th>Status</th><th>Submitted</th></tr></thead><tbody>${rows.map(r=>`<tr class="reportRow" data-report="${r.id}"><td class="reportName">${esc(r.title)}</td><td>${money(r.total)}</td><td>${r.count}</td><td><span class="status ${statusClass(r.status)}">${r.status}</span></td><td>${r.submitted?fmt(r.submitted):'—'}</td></tr>`).join('')}</tbody></table>`}
function reports(){return `${pageHead('Report management','My Reports','Build, review and submit expense reports while keeping approval progress visible.','<button class="btn primary" data-new-report>＋ New Report</button>')}<section class="card hero"><div class="heroHeader"><div><div class="eyebrow">Current report</div><h2>${state.currentReport.title}</h2><div class="meta"><span>${state.expenses.filter(e=>!e.reported).length} expenses</span><span>•</span><span>${missingCount()} missing receipts</span></div></div><span class="status ${statusClass(state.currentReport.status)}">${state.currentReport.status}</span></div><div class="amount" style="font-size:44px">${money(currentTotal())}</div>${timeline(state.currentReport.status==='Draft'?'Employee':state.currentReport.status==='Submitted'?'Approver':'Employee')}<div class="heroActions"><button class="btn secondary" data-edit-report>Edit draft</button><button class="btn primary" data-submit-report ${missingCount()?'disabled':''}>Submit for Approval</button>${missingCount()?`<span class="pill">Attach ${missingCount()} missing receipt${missingCount()>1?'s':''} first</span>`:''}</div></section><section class="card" style="margin-top:18px"><div class="sectionTitle"><h2>Expenses in this report</h2><span class="pill">${money(currentTotal())}</span></div><div class="list">${state.expenses.filter(e=>!e.reported).map(e=>expenseRow(e)).join('')}</div></section><section class="card" style="margin-top:18px"><div class="sectionTitle"><h2>Previous reports</h2><span class="pill">${state.reports.length} reports</span></div>${reportTable(state.reports)}</section>`}
function expenses(){let rows=state.expenses.filter(e=>(state.category==='All'||e.category===state.category)&&(`${e.merchant} ${e.purpose} ${e.desc}`.toLowerCase().includes(state.query.toLowerCase())));return `${pageHead('Expense history','Expenses','Search, scan and open individual expenses without leaving the page.','<button class="btn primary" data-add>＋ Add Expense</button>')}<section class="card"><div class="toolbar"><div class="search"><input id="expenseSearch" placeholder="Search merchant, purpose, description…" value="${esc(state.query)}"></div><div class="filters"><select id="catFilter"><option>All</option>${Object.keys(categories).map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select><select><option>All states</option><option>Draft</option><option>Submitted</option></select></div></div><div class="list" style="margin-top:16px">${rows.length?rows.map(e=>expenseRow(e)).join(''):'<div class="empty"><strong>No expenses found.</strong><div>Try changing your filters.</div></div>'}</div></section>`}
function approvals(){const cur=state.approvals.find(x=>x.id===state.selectedApproval)||state.approvals[0];return `${pageHead('Approver workspace','Approvals','Review 10–20 reports quickly with exceptions surfaced before you open each report.',`<span class="pill">${state.approvals.length} waiting</span>`)}<div class="approvalLayout"><section class="card"><div class="sectionTitle"><h2>Needs your attention</h2><span class="pill">Oldest first</span></div><div class="queue">${state.approvals.length?state.approvals.map(x=>`<button class="queueItem ${cur&&x.id===cur.id?'active':''}" data-approval="${x.id}"><div class="queueTop"><strong>${esc(x.employee)}</strong><strong>${money(x.total)}</strong></div><div class="expenseMeta">${x.report} · ${x.count} expenses · ${x.age} ago</div><div style="margin-top:8px;display:flex;gap:6px;align-items:center"><span class="status approval">${x.status}</span>${x.receipts!==`${x.count}/${x.count}`?`<span class="receiptFlag">${x.receipts} receipts</span>`:''}</div></button>`).join(''):'<div class="empty"><strong>You’re caught up.</strong><div>No reports need approval.</div></div>'}</div></section><section class="card reviewPane">${cur?`<div class="heroHeader"><div><div class="eyebrow">Report review</div><h2 style="margin:5px 0">${esc(cur.employee)}</h2><div class="meta"><span>${cur.report}</span><span>•</span><span>${cur.count} expenses</span><span>•</span><span>${cur.receipts} receipts</span></div></div><div class="amount" style="font-size:38px;margin:0">${money(cur.total)}</div></div>${timeline('Approver')}<div class="receiptLarge" data-receipt><div class="receiptPaper"><strong>${esc(cur.merchant)}</strong><br><br>Business Expense<br>09/08/2026<br><br>Subtotal........${money(cur.amount-3.14)}<br>Tax..............$3.14<br><br><strong>Total...........${money(cur.amount)}</strong><br><br>Thank you</div></div><div class="expense" style="margin-top:14px"><div class="expenseTop"><div><strong>${esc(cur.merchant)}</strong><div class="expenseMeta">Meals · Employee travel meal</div><div class="expensePurpose">Business meal while visiting a restaurant test.</div></div><strong>${money(cur.amount)}</strong></div></div><div class="approvalActions"><button class="btn good" data-approve-action="approved">✓ Approve</button><button class="btn secondary" data-approve-action="returned">Return for Correction</button><button class="btn secondary" data-approve-action="additional">Request Additional Approval</button><button class="btn danger" data-approve-action="denied">Deny</button></div>`:'<div class="empty"><strong>You’re caught up.</strong><div>No reports are waiting for approval.</div></div>'}</section></div>`}
function accounting(){return `${pageHead('Accounting workspace','Ready for reimbursement','Reports here have completed approval and are ready for Accounting review.',`<span class="pill">${state.accounting.length} ready</span>`)}<section class="card">${state.accounting.length?`<table class="reportsTable"><thead><tr><th>Employee</th><th>Report</th><th>Total</th><th>Expenses</th><th>Status</th><th></th></tr></thead><tbody>${state.accounting.map(r=>`<tr><td class="reportName">${esc(r.employee)}</td><td>${esc(r.report)}</td><td>${money(r.total)}</td><td>${r.count}</td><td><span class="status accounting">Accounting Review</span></td><td><div class="actions"><button class="btn secondary small" data-account-return="${r.id}">Return to Approver</button><button class="btn good small" data-account-complete="${r.id}">Mark Complete</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><strong>Queue cleared.</strong><div>No reimbursements are waiting.</div></div>'}</section>`}
function settings(){return `${pageHead('Preferences','Settings','Personal defaults and prototype experience options.')}<div class="grid settingsGrid"><section class="card"><h2>Expense defaults</h2><div class="field" style="margin-top:14px"><label>Default department</label><select><option>Profitability & Operations</option><option>Operations</option><option>IT</option><option>Accounting</option></select></div><div class="field" style="margin-top:14px"><label>Mileage rate</label><input value="$0.40 / mile" readonly></div></section><section class="card"><h2>Experience</h2><div class="settingRow"><div><strong>Report reminders</strong><div class="muted">Notify me before a report period closes.</div></div><button class="toggle on" data-toggle><span></span></button></div><div class="settingRow"><div><strong>Compact expense rows</strong><div class="muted">Show more expenses at once on desktop.</div></div><button class="toggle" data-toggle><span></span></button></div></section></div>`}
function view(){if(state.view==='home')return home();if(state.view==='reports')return reports();if(state.view==='expenses')return expenses();if(state.view==='approvals')return approvals();if(state.view==='accounting')return accounting();return settings()}
function mobileNav(){const items=state.role==='employee'?[['home','Home'],['reports','Reports'],['expenses','Expenses'],['settings','Settings'],['approvals','Approvals']]:state.role==='approver'?[['approvals','Approvals'],['reports','Reports'],['expenses','Expenses'],['home','Home'],['settings','Settings']]:[['accounting','Accounting'],['reports','Reports'],['expenses','Expenses'],['home','Home'],['settings','Settings']];return `<nav class="mobileNav">${items.map(([id,label])=>`<button class="${state.view===id?'active':''}" data-mobile-nav="${id}">${icons[id]||icons.home}<span>${label}</span></button>`).join('')}</nav>`}
function render(){$('#app').innerHTML=`<div class="shell">${sidebar()}<main class="main">${topbar()}<div class="content">${state.loading?'<div class="card"><div class="skeletonBlock"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>':view()}</div></main>${mobileNav()}</div>`;bind();renderLayers()}
function renderLayers(){let html='';if(state.drawer)html+=addExpenseDrawer();if(state.modal)html+=modalHtml();html+=`<div class="toastStack">${state.toasts.map(t=>`<div class="toast ${t.kind}"><span>${t.kind==='bad'?'!':'✓'}</span><span>${esc(t.text)}</span></div>`).join('')}</div>`;$('#layers').innerHTML=html;bindLayers()}
function addExpenseDrawer(){return `<div class="backdrop" data-close-layer></div><section class="drawer" role="dialog" aria-modal="true" aria-label="Add expense"><div class="drawerHead"><div><div class="eyebrow">New expense</div><h2>Add Expense</h2></div><button class="btn ghost" data-close-layer>✕</button></div><form id="expenseForm" class="drawerBody"><div class="formGrid"><div class="field full amountField"><label>Amount</label><input name="amount" type="number" step="0.01" min="0" placeholder="$0.00" required autofocus></div><div class="field"><label>Category</label><select name="category" id="drawerCategory" required>${Object.keys(categories).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label>Subcategory</label><select name="sub" id="drawerSub"></select></div><div class="field"><label>Merchant</label><input name="merchant" placeholder="Merchant or vendor" required></div><div class="field"><label>Date</label><input name="date" type="date" value="2026-09-10" required></div><div class="field full"><label>Business purpose</label><input name="purpose" placeholder="Why was this expense necessary?" required></div><div class="field full"><label>Description <span class="muted">(optional)</span></label><textarea name="desc" rows="3" placeholder="Add context that would help an approver."></textarea></div><div class="field full"><label>Receipt</label><div class="dropzone" id="dropzone"><strong>Drop a receipt here</strong><div class="muted" style="margin:5px 0 10px">or choose a file from your device</div><input id="receiptFile" type="file" accept="image/*,.pdf"></div><div id="receiptSlot"></div></div></div></form><div class="drawerFoot"><button class="btn secondary" data-close-layer>Cancel</button><button class="btn primary" data-save-expense>Save Expense</button></div></section>`}
function modalHtml(){if(state.modal.type==='receipt')return `<div class="backdrop" data-close-modal></div><section class="modal"><div class="modalHead"><div><div class="eyebrow">Receipt preview</div><h2 style="margin:4px 0 0">${esc(state.modal.title||'Receipt')}</h2></div><button class="btn ghost" data-close-modal>✕</button></div><div class="modalBody"><div class="actions" style="margin-bottom:12px"><button class="btn secondary small" data-zoom="-0.2">− Zoom</button><span class="pill" id="zoomLabel">100%</span><button class="btn secondary small" data-zoom="0.2">＋ Zoom</button></div><div class="zoomStage"><div class="receiptPaper zoomReceipt" id="zoomReceipt"><strong>${esc(state.modal.title||'Merchant')}</strong><br><br>Business Expense<br>09/08/2026<br><br>Subtotal........$49.20<br>Tax..............$3.14<br><br><strong>Total...........$52.34</strong><br><br>Thank you</div></div></div></section>`;if(state.modal.type==='report')return `<div class="backdrop" data-close-modal></div><section class="modal"><div class="modalHead"><div><div class="eyebrow">Report detail</div><h2 style="margin:4px 0 0">${esc(state.modal.report.title)}</h2></div><button class="btn ghost" data-close-modal>✕</button></div><div class="modalBody"><div class="heroHeader"><div><span class="status ${statusClass(state.modal.report.status)}">${state.modal.report.status}</span></div><div class="amount" style="font-size:38px;margin:0">${money(state.modal.report.total)}</div></div>${timeline(state.modal.report.stage||'Complete')}<div class="stats"><div class="stat"><strong>${state.modal.report.count}</strong><small>Expenses</small></div><div class="stat"><strong>${state.modal.report.submitted?fmt(state.modal.report.submitted):'—'}</strong><small>Submitted</small></div><div class="stat"><strong>${state.modal.report.stage||'Draft'}</strong><small>Workflow</small></div></div></div></section>`;if(state.modal.type==='newreport'||state.modal.type==='editreport')return `<div class="backdrop" data-close-modal></div><section class="modal"><div class="modalHead"><div><div class="eyebrow">${state.modal.type==='newreport'?'New report':'Edit report'}</div><h2 style="margin:4px 0 0">${state.modal.type==='newreport'?'Create Expense Report':'Report Details'}</h2></div><button class="btn ghost" data-close-modal>✕</button></div><div class="modalBody"><div class="formGrid"><div class="field full"><label>Report name</label><input id="reportName" value="${state.modal.type==='editreport'?esc(state.currentReport.title):'September 16–30, 2026'}"></div><div class="field"><label>Period start</label><input type="date" value="2026-09-16"></div><div class="field"><label>Period end</label><input type="date" value="2026-09-30"></div><div class="field full"><label>Department</label><select><option>Profitability & Operations</option><option>Operations</option></select></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn secondary" data-close-modal>Cancel</button><button class="btn primary" data-save-report>${state.modal.type==='newreport'?'Create Report':'Save Changes'}</button></div></div></section>`;return ''}
function bind(){$$('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));$$('[data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));$$('[data-add]').forEach(b=>b.onclick=()=>{state.drawer=true;renderLayers()});$$('[data-expense]').forEach(b=>b.onclick=()=>{state.expanded=state.expanded===b.dataset.expense?null:b.dataset.expense;render()});$$('[data-report]').forEach(b=>b.onclick=()=>{const r=state.reports.find(x=>x.id===b.dataset.report);state.modal={type:'report',report:r};renderLayers()});$$('[data-approval]').forEach(b=>b.onclick=()=>{state.selectedApproval=b.dataset.approval;render()});$$('[data-approve-action]').forEach(b=>b.onclick=()=>approvalAction(b.dataset.approveAction));$$('[data-account-complete]').forEach(b=>b.onclick=()=>accountComplete(b.dataset.accountComplete));$$('[data-account-return]').forEach(b=>b.onclick=()=>accountReturn(b.dataset.accountReturn));$$('[data-toggle]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('[data-new-report]')?.addEventListener('click',()=>{state.modal={type:'newreport'};renderLayers()});$('[data-edit-report]')?.addEventListener('click',()=>{state.modal={type:'editreport'};renderLayers()});$('[data-submit-report]')?.addEventListener('click',submitReport);$('[data-command]')?.addEventListener('click',()=>toast('Quick actions: press / to jump to expense search.'));const q=$('#expenseSearch');if(q)q.oninput=e=>{state.query=e.target.value;render()};const cf=$('#catFilter');if(cf)cf.onchange=e=>{state.category=e.target.value;render()};$$('[data-mobile-nav]').forEach(b=>b.onclick=()=>{const v=b.dataset.mobileNav;if(v==='approvals'){state.role='approver';state.view='approvals'}else if(v==='accounting'){state.role='accounting';state.view='accounting'}else{state.role='employee';state.view=v}render()})}
function bindLayers(){$$('[data-close-layer]').forEach(b=>b.onclick=()=>{state.drawer=false;renderLayers()});$$('[data-close-modal]').forEach(b=>b.onclick=()=>{state.modal=null;renderLayers()});$('[data-save-expense]')?.addEventListener('click',saveExpense);$('[data-save-report]')?.addEventListener('click',saveReport);const cat=$('#drawerCategory');if(cat){fillSubs();cat.onchange=fillSubs}const dz=$('#dropzone'),file=$('#receiptFile');if(dz){['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>previewReceipt(e.dataTransfer.files[0]));file.onchange=e=>previewReceipt(e.target.files[0])}$$('[data-zoom]').forEach(b=>b.onclick=()=>changeZoom(Number(b.dataset.zoom)))}
function fillSubs(){const cat=$('#drawerCategory'),sub=$('#drawerSub');if(!cat||!sub)return;sub.innerHTML=(categories[cat.value]||[]).map(x=>`<option>${x}</option>`).join('')}
function previewReceipt(file){if(!file)return;state._receipt=true;$('#receiptSlot').innerHTML=`<div class="receiptPreview"><div class="receiptMock"></div><div style="padding:10px 12px;display:flex;justify-content:space-between;gap:10px"><strong>${esc(file.name)}</strong><span class="muted">Ready to attach</span></div></div>`}
function saveExpense(){const form=$('#expenseForm');if(!form.reportValidity())return;const fd=new FormData(form),e={id:'e'+Date.now(),merchant:fd.get('merchant'),date:fd.get('date'),amount:Number(fd.get('amount')),category:fd.get('category'),sub:fd.get('sub'),purpose:fd.get('purpose'),desc:fd.get('desc'),receipt:!!state._receipt,reported:false};state.expenses.unshift(e);state._receipt=false;state.drawer=false;render();toast('Expense saved to your current report.','good')}
function saveReport(){const name=$('#reportName')?.value.trim();if(!name)return;state.currentReport.title=name;state.modal=null;render();toast('Report details saved.','good')}
function submitReport(){if(missingCount()){toast('Attach missing receipts before submitting.','bad');return}state.currentReport.status='Submitted';state.currentReport.submitted='2026-09-10';render();toast('Report submitted to your approver.','good')}
function approvalAction(action){const cur=state.approvals.find(x=>x.id===state.selectedApproval);if(!cur)return;const messages={approved:'Report approved and sent to Accounting.',returned:'Report returned to the employee for correction.',additional:'Additional approval requested.',denied:'Report denied.'};if(['approved','denied','returned'].includes(action))state.approvals=state.approvals.filter(x=>x.id!==cur.id);state.selectedApproval=state.approvals[0]?.id||null;render();toast(messages[action],action==='denied'?'bad':'good')}
function accountComplete(id){const r=state.accounting.find(x=>x.id===id);state.accounting=state.accounting.filter(x=>x.id!==id);render();toast(`${r.employee}'s reimbursement marked complete.`,'good')}
function accountReturn(id){const r=state.accounting.find(x=>x.id===id);state.accounting=state.accounting.filter(x=>x.id!==id);render();toast(`${r.employee}'s report returned to the approver.`,'good')}
let zoom=1;function changeZoom(delta){zoom=Math.min(2.2,Math.max(.8,zoom+delta));const r=$('#zoomReceipt'),l=$('#zoomLabel');if(r)r.style.transform=`scale(${zoom})`;if(l)l.textContent=Math.round(zoom*100)+'%'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.drawer)state.drawer=false;if(state.modal)state.modal=null;renderLayers()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();state.role='employee';state.view='expenses';render();setTimeout(()=>$('#expenseSearch')?.focus(),0)}});document.addEventListener('click',e=>{if(e.target.closest('[data-receipt]')){state.modal={type:'receipt',title:state.approvals.find(x=>x.id===state.selectedApproval)?.merchant||'Receipt'};zoom=1;renderLayers()}});render();
})();
</script>
</body>
</html>
