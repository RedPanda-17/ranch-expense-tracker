name: UI overhaul audit
on:
  push:
    branches: [ui-overhaul-premium]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect application structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          text='\n'.join(lines)
          print('=== INDEX SUMMARY ===')
          print('lines', len(lines), 'bytes', len(text.encode()))
          print('external scripts', re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I))
          print('external styles', re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)', text, re.I))
          print('\n=== SECTION LINE NUMBERS ===')
          for i,line in enumerate(lines,1):
              if '<section id=' in line or '<nav ' in line or '<header ' in line or '<div id="receiptViewer"' in line:
                  print(f'{i}: {line.strip()}')
          def snippet(label, needle, before=8, after=65):
              print(f'\n=== {label} ===')
              for i,line in enumerate(lines):
                  if needle in line:
                      s=max(0,i-before); e=min(len(lines),i+after)
                      for j in range(s,e): print(f'{j+1}: {lines[j]}')
                      return
              print('NOT FOUND')
          snippet('DASHBOARD MARKUP','<section id="dashboard"',3,90)
          snippet('ADD EXPENSE MARKUP','<section id="add"',3,150)
          snippet('CURRENT REPORT MARKUP','<section id="current"',3,150)
          snippet('HISTORY MARKUP','<section id="history"',3,95)
          snippet('PAST REPORTS MARKUP','<section id="past"',3,80)
          snippet('SETTINGS MARKUP','<section id="settings"',3,100)
          snippet('RECEIPT VIEWER','<div id="receiptViewer"',3,85)
          snippet('showView','function showView(',5,70)
          snippet('showToast','function showToast(',5,50)
          snippet('expenseCardHtml','function expenseCardHtml(',5,120)
          snippet('renderDashboard','function renderDashboard(',5,120)
          snippet('renderCurrentReport','function renderCurrentReport(',5,180)
          snippet('renderHistory','function renderHistory(',5,100)
          snippet('renderPastReports','function renderPastReports(',5,130)
          snippet('saveExpense','async function saveExpense(',5,170)
          snippet('renderInlineReceiptPreview','function renderInlineReceiptPreview(',5,100)
          snippet('openReceiptBlob','function openReceiptBlob(',5,100)
          print('\n=== CSS MEDIA QUERIES ===')
          for i,line in enumerate(lines,1):
              if '@media' in line: print(f'{i}: {line.strip()}')
          PY
