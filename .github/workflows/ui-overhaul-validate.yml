name: Validate premium UI
on:
  push:
    branches: [ui-overhaul-premium]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static compatibility checks
        shell: bash
        run: |
          node --check ui-premium.js
          python - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=[
            'const APP_VERSION = "2.1.2"',
            'const FIXED_MILEAGE_RATE = 0.40',
            'const EXPENSE_KEY = "workExpenseTool.expenses.v2"',
            'const REPORT_KEY = "workExpenseTool.reports.v2"',
            'SUPABASE_URL',
            'ranchCloudReceiptLoader',
            'function saveExpense(',
            'function finalizeCurrentReport(',
            'function openReceiptBlob(',
            'ui-premium.css?v=2.2-preview',
            'ui-premium.js?v=2.2-preview'
          ]
          missing=[item for item in required if item not in t]
          if missing: raise SystemExit('Missing compatibility contracts: '+', '.join(missing))
          if t.count('ui-premium.css') != 1 or t.count('ui-premium.js') != 1:
            raise SystemExit('Premium assets must be wired exactly once.')
          print('Static compatibility contracts passed.')
          PY
      - name: Install browser test runtime
        shell: bash
        run: |
          mkdir -p ui-test-run
          npm install --prefix ui-test-run --silent playwright@1.55.0
          ./ui-test-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local app
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ranch-ui-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/ranch-ui-http.log
          exit 1
      - name: Run desktop and mobile interaction checks
        shell: bash
        run: |
          mkdir -p ui-test-artifacts
          node scripts/ui-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranch-ui-overhaul-screenshots
          path: ui-test-artifacts
          if-no-files-found: ignore
