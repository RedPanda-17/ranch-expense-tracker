name: Patch UI validation runtime
on:
  push:
    branches: [ui-overhaul-premium]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-premium
      - name: Fix npm workspace directory name
        run: |
          sed -i 's/\.ui-test/ui-test-run/g' .github/workflows/ui-overhaul-validate.yml
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ui-overhaul-validate.yml
          git commit -m "Fix UI browser validation runtime [ui-test-fix]"
          git push origin HEAD:ui-overhaul-premium
