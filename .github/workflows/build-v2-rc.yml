name: Build Ranch Expense Tracker 2.0 RC

on:
  push:
    branches: [main]
    paths-ignore:
      - 'v2-rc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare clean V2 build source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/build-v2-rc.mjs')
          text = p.read_text()
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if "replaceRequired('const RELEASE_NAME" in line:
                  lines[i] = line.replace('PDF Accounting Review Update', 'Cloud Sync Release Candidate')
          text = '\n'.join(lines) + '\n'
          text = text.replace("const finalExpenses/');", "const finalExpenses');")
          p.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text, setup_count = re.subn(r'\s*<div id="setupBanner" class="setup-banner" hidden>[\s\S]*?<button class="primary" type="button" onclick="showView\(\'settings\', \{ focus: \'employeeName\' \}\)">Open Settings</button>\s*</div>', '', text, count=1)
          text, backup_count = re.subn(r'\s*<div id="backupReminder" class="card backup-reminder" hidden>[\s\S]*?<button class="secondary" type="button" onclick="dismissBackupReminder\(\)">Remind Me Later</button>\s*</div>\s*</div>', '', text, count=1)
          if setup_count != 1:
              raise SystemExit(f'Expected one legacy setup banner, removed {setup_count}')
          if backup_count != 1:
              raise SystemExit(f'Expected one legacy backup banner, removed {backup_count}')
          index.write_text(text)
          PY

      - name: Build and audit V2 release candidate
        run: node scripts/build-v2-rc.mjs

      - name: Check generated changes
        run: git diff --check -- v2-rc

      - name: Publish generated V2 RC files
        run: |
          if git diff --quiet -- v2-rc; then
            echo "V2 RC output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-rc
          git commit -m "Build Ranch Expense Tracker 2.0.0 RC [skip ci]"
          git push
