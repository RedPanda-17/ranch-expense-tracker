name: Ranch Expense Tracker 2.0 RC Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Release candidate archived
        run: |
          echo "Ranch Expense Tracker 2.0.0 was promoted to production on 2026-09-05."
          echo "The former RC build workflow is intentionally retired because main now contains the V2 production source."
          echo "Use the archive-pre-2.0.0-production-2026-09-05 branch to reproduce the pre-production RC state."
