name: Build Ranch Expense Tracker 2.0 RC

on:
  push:
    branches: [main]
    paths-ignore:
      - 'v2-rc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v2-rc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize V2 build marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-v2-rc.mjs')
          text = p.read_text()
          text = text.replace(
              "replaceRequired('const RELEASE_NAME = \\\"PDF Accounting Review Update\\\";',",
              "replaceRequired('const RELEASE_NAME = \\\"Cloud Sync Release Candidate\\\";',"
          )
          p.write_text(text)
          PY

      - name: Build and audit V2 release candidate
        run: node scripts/build-v2-rc.mjs

      - name: Check generated changes
        run: git diff --check -- v2-rc

      - name: Publish generated V2 RC files
        run: |
          if git diff --quiet -- v2-rc; then
            echo "V2 RC output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-rc
          git commit -m "Build Ranch Expense Tracker 2.0.0 RC [skip ci]"
          git push
