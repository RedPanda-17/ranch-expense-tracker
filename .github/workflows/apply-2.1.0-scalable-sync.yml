name: Apply Ranch Expense Tracker 2.1.0 scalable sync

on:
  push:
    branches:
      - feature-2.1.0-scalable-sync

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature-2.1.0-scalable-sync
          fetch-depth: 0

      - name: Apply scalable sync patch
        run: python3 scripts/patch-2.1.0-scalable-sync.py

      - name: Validate production source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Ranch Expense Tracker - Version 2.1.0',
              'async function getReceiptForViewing(receiptId)',
              'window.ranchCloudReceiptLoader = async expense =>',
              'receipt_purged_at',
              'Cloud-backed receipts stay cloud-only',
              'previously cached cloud receipt'
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')

          if 'await sb.storage.from(BUCKET).download(row.receipt_path);' not in text:
              raise SystemExit('On-demand cloud download path is missing')

          # The old pull path must no longer persist cloud downloads with putReceipt.
          pull_match = re.search(r'async function pullExpense\(row, oldExpense\) \{(.*?)\n\}\n\nasync function tombstoneExpense', text, re.S)
          if not pull_match:
              raise SystemExit('pullExpense function was not found')
          if '.download(' in pull_match.group(1) or 'putReceipt(' in pull_match.group(1):
              raise SystemExit('pullExpense still downloads or stores receipt binaries')

          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I)
          for i, (attrs, code) in enumerate(scripts):
              if not code.strip():
                  continue
              suffix = '.mjs' if 'type="module"' in attrs or "type='module'" in attrs else '.js'
              with tempfile.NamedTemporaryFile('w', suffix=suffix, delete=False, encoding='utf-8') as handle:
                  handle.write(code)
                  temp_name = handle.name
              result = subprocess.run(['node', '--check', temp_name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f'Inline script {i} failed syntax validation:\n{result.stderr}')

          result = subprocess.run(['node', '--check', 'service-worker.js'], capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit(result.stderr)

          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          if version.get('version') != '2.1.0':
              raise SystemExit('version.json was not bumped to 2.1.0')
          if 'ranch-expense-tracker-v2-2.1.0' not in Path('service-worker.js').read_text(encoding='utf-8'):
              raise SystemExit('service-worker cache namespace was not bumped to 2.1.0')
          PY

      - name: Commit 2.1.0 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js version.json README.md CHANGELOG.md RELEASE_NOTES.md
          git commit -m "Build Ranch Expense Tracker 2.1.0 scalable cloud sync"
          git push origin HEAD:feature-2.1.0-scalable-sync
