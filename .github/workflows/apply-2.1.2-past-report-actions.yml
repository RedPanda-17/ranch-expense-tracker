name: Apply Ranch Expense Tracker 2.1.2 past report alignment

on:
  push:
    branches:
      - ui-2.1.2-past-report-actions

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui-2.1.2-past-report-actions
          fetch-depth: 0

      - name: Apply visual alignment patch
        run: python3 scripts/patch-2.1.2-past-report-actions.py

      - name: Validate source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re, subprocess, tempfile

          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'Ranch Expense Tracker - Version 2.1.2',
              '.report-actions { grid-column: 1 / -1; display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; }',
              "downloadPastReportPdf",
              "downloadPastReportCsv"
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')

          if '.report-actions { display: flex; justify-content: flex-end;' in text:
              raise SystemExit('Old desktop report action alignment still present')

          scripts = re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.S|re.I)
          for i, (attrs, code) in enumerate(scripts):
              if not code.strip():
                  continue
              suffix = '.mjs' if 'type="module"' in attrs or "type='module'" in attrs else '.js'
              with tempfile.NamedTemporaryFile('w', suffix=suffix, delete=False, encoding='utf-8') as handle:
                  handle.write(code)
                  temp_name = handle.name
              result = subprocess.run(['node', '--check', temp_name], capture_output=True, text=True)
              if result.returncode != 0:
                  raise SystemExit(f'Inline script {i} failed syntax validation:\n{result.stderr}')

          result = subprocess.run(['node', '--check', 'service-worker.js'], capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit(result.stderr)

          version = json.loads(Path('version.json').read_text(encoding='utf-8'))
          if version.get('version') != '2.1.2':
              raise SystemExit('version.json was not bumped to 2.1.2')
          if 'ranch-expense-tracker-v2-2.1.2' not in Path('service-worker.js').read_text(encoding='utf-8'):
              raise SystemExit('service-worker cache namespace was not bumped')
          PY

      - name: Commit 2.1.2 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js version.json README.md CHANGELOG.md RELEASE_NOTES.md
          git commit -m "Build Ranch Expense Tracker 2.1.2 past reports polish"
          git push origin HEAD:ui-2.1.2-past-report-actions
