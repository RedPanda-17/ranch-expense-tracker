name: Apply Ranch Expense Tracker 2.0.2 startup update fix

on:
  push:
    branches:
      - hotfix-2.0.2-startup-update

permissions:
  contents: write

jobs:
  patch-production-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-2.0.2-startup-update
          fetch-depth: 0

      - name: Apply and validate Version 2.0.2 hotfix
        run: python3 scripts/apply-2.0.2-hotfix.py

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic startup update guard in 2.0.2"
          git push origin hotfix-2.0.2-startup-update
