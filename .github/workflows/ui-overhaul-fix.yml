name: Harden premium UI layer
on:
  push:
    branches: [ui-overhaul-premium]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-premium
      - name: Apply final presentation safeguards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-premium.css')
          t=p.read_text(encoding='utf-8')
          additions=[]
          if '#add.view[aria-hidden="true"]' not in t:
              additions.append('''
/* Keep the off-canvas form out of the accessibility/interaction surface while closed. */
#add.view[aria-hidden="true"] { visibility: hidden; }
#add.view.active { visibility: visible; }
''')
          if '.ui-expense-mobile-meta-override' not in t:
              additions.append('''
/* Keep date + receipt state scannable even when mobile expense details are collapsed. */
@media (max-width: 760px) {
  .expense-item.ui-collapsed .expense-meta.ui-expense-mobile-meta-override { display: block; }
}
''')
          if '#saveExpenseButton.ui-saving::after' not in t:
              additions.append('''
#saveExpenseButton.ui-saving { position: relative; padding-right: 40px; }
#saveExpenseButton.ui-saving::after {
  content: "";
  position: absolute;
  right: 15px;
  top: 50%;
  width: 14px;
  height: 14px;
  margin-top: -7px;
  border: 2px solid rgba(255,255,255,.42);
  border-top-color: #fff;
  border-radius: 50%;
  animation: uiSpin .7s linear infinite;
}
@keyframes uiSpin { to { transform: rotate(360deg); } }
''')
          if additions:
              p.write_text(t+'\n'+''.join(additions), encoding='utf-8')
          
          p=Path('ui-premium.js')
          j=p.read_text(encoding='utf-8')
          marker="container.querySelectorAll('.expense-item').forEach(card => {"
          replacement="container.querySelectorAll('.expense-item').forEach(card => {\n      card.querySelector('.expense-meta')?.classList.add('ui-expense-mobile-meta-override');"
          if 'ui-expense-mobile-meta-override' not in j:
              if marker not in j: raise SystemExit('Expense enhancement marker not found')
              j=j.replace(marker,replacement,1)
              p.write_text(j,encoding='utf-8')
          PY
      - name: Syntax check interaction layer
        run: node --check ui-premium.js
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-premium.js ui-premium.css
          git commit -m "Harden premium UI behavior [ui-fix]"
          git push origin HEAD:ui-overhaul-premium
