name: Harden premium UI layer
on:
  push:
    branches: [ui-overhaul-premium]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-premium
      - name: Apply idempotency and accessibility fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui-premium.js')
          t=p.read_text(encoding='utf-8')
          old="""    const target = card.querySelector('.ui-recent-list');
    if (!target) return;
    const expenses = [...historyList.querySelectorAll('.expense-item')].slice(0, 3);
    if (!expenses.length) {
      target.innerHTML = '<div class=\"empty-state\">Your latest expenses will appear here as you add them.</div>';
      return;
    }
    target.replaceChildren(...expenses.map(cloneExpenseForDashboard));
"""
          new="""    const target = card.querySelector('.ui-recent-list');
    if (!target) return;
    const expenses = [...historyList.querySelectorAll('.expense-item')].slice(0, 3);
    const signature = expenses.map(expense => (expense.textContent || '').replace(/\\s+/g, ' ').trim()).join('|');
    if (target.dataset.uiSignature === signature) return;
    target.dataset.uiSignature = signature;
    if (!expenses.length) {
      target.innerHTML = '<div class=\"empty-state\">Your latest expenses will appear here as you add them.</div>';
      return;
    }
    target.replaceChildren(...expenses.map(cloneExpenseForDashboard));
"""
          if old not in t:
              raise SystemExit('Recent-expense target block not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          p=Path('ui-premium.css')
          t=p.read_text(encoding='utf-8')
          t=t.replace("#add.view.active {\n  transform: translateX(0);", "#add.view[aria-hidden=\"true\"] { visibility: hidden; }\n#add.view.active {\n  visibility: visible;\n  transform: translateX(0);", 1)
          t=t.replace("  .expense-item.ui-collapsed .expense-meta,\n  .expense-item.ui-collapsed .expense-purpose,", "  .expense-item.ui-collapsed .expense-purpose,", 1)
          t += '''\n#saveExpenseButton.ui-saving{position:relative;padding-right:40px;}\n#saveExpenseButton.ui-saving::after{content:\"\";position:absolute;right:15px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid rgba(255,255,255,.42);border-top-color:#fff;border-radius:50%;animation:uiSpin .7s linear infinite;}\n@keyframes uiSpin{to{transform:rotate(360deg)}}\n'''
          p.write_text(t,encoding='utf-8')
          PY
      - name: Syntax check interaction layer
        run: node --check ui-premium.js
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-premium.js ui-premium.css
          git commit -m "Harden premium UI behavior [ui-fix]"
          git push origin HEAD:ui-overhaul-premium
